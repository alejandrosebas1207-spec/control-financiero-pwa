<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo obsidiana / grafito profundo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18221D"/>
      <stop offset="45%" stop-color="#111614"/>
      <stop offset="100%" stop-color="#090C0B"/>
    </linearGradient>

    <!-- Resplandor ambiental de luz menta / oro -->
    <radialGradient id="glow" cx="46%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#C4EF96" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#88D7B0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#111614" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente del monograma AS (blanco titanio a menta de lujo) -->
    <linearGradient id="glyphGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F8F3"/>
      <stop offset="100%" stop-color="#C4EF96"/>
    </linearGradient>

    <!-- Sombra profunda iOS Native -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#C4EF96" flood-opacity="0.16"/>
    </filter>

    <!-- Borde especular -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(196,239,150,0.12)"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base iOS Native -->
  <rect x="8" y="8" width="496" height="496" rx="118" ry="118" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="118" ry="118" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="118" ry="118" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Anillo geométrico orbital interno sutil -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="rgba(196,239,150,0.06)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Monograma AS Tipográfico Centrado Ópticamente -->
  <g filter="url(#shadow)">
    <text x="256" y="327" 
          font-family="Montserrat, -apple-system, sans-serif" 
          font-size="204" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="url(#glyphGrad)">AS</text>
  </g>
</svg>